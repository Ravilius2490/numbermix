<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NumberMix</title>
<style>body{font:16px system-ui;background:#0b1220;color:#f4f7fb;max-width:700px;margin:30px auto;padding:20px}button,input{font:inherit;padding:10px;border-radius:9px}button{background:#8cf0c8;border:0;margin:4px;cursor:pointer}.balls span{display:inline-grid;place-items:center;background:#b6a2ff;color:#17102f;border-radius:50%;width:44px;height:44px;margin:5px;font-weight:bold}.panel{background:#18263d;padding:18px;border-radius:16px}input{width:80px}</style></head>
<body><h1>NumberMix</h1><p id="desc">Бесплатный генератор случайных чисел</p><button onclick="setL('ru')">Русский</button><button onclick="setL('pl')">Polski</button>
<div class="panel"><h2 id="title">Генератор чисел</h2><p>Min <input id="min" type="number" value="1"> Max <input id="max" type="number" value="49"></p><p><span id="countlabel">Чисел в комбинации</span> <input id="count" type="number" value="6" min="1" max="100"></p><button id="go" onclick="gen()">Сгенерировать</button><div class="balls" id="out"></div></div>
<p id="ad">Место для рекламы — пока не подключена</p><p id="note">Случайные комбинации не повышают шансы выигрыша.</p>
<script>
let lang='ru';
function setL(l){lang=l;document.documentElement.lang=l;document.getElementById('desc').textContent=l==='ru'?'Бесплатный генератор случайных чисел':'Darmowy generator liczb losowych';document.getElementById('title').textContent=l==='ru'?'Генератор чисел':'Generator liczb';document.getElementById('countlabel').textContent=l==='ru'?'Чисел в комбинации':'Liczb w kombinacji';document.getElementById('go').textContent=l==='ru'?'Сгенерировать':'Losuj';document.getElementById('ad').textContent=l==='ru'?'Место для рекламы — пока не подключена':'Miejsce na reklamę — jeszcze niepodłączona';document.getElementById('note').textContent=l==='ru'?'Случайные комбинации не повышают шансы выигрыша.':'Losowe kombinacje nie zwiększają szansy na wygraną.'}
function gen(){let a=+document.getElementById('min').value,b=+document.getElementById('max').value,n=+document.getElementById('count').value;if(a>b||n<1||n>b-a+1){alert(lang==='ru'?'Проверь диапазон и количество':'Sprawdź zakres i liczbę');return}let s=new Set();while(s.size<n)s.add(Math.floor(Math.random()*(b-a+1))+a);document.getElementById('out').innerHTML=[...s].sort((x,y)=>x-y).map(x=>'<span>'+x+'</span>').join('')}
</script></body></html>
